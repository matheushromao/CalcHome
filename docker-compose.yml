services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: consumo
      POSTGRES_PASSWORD: consumo
      POSTGRES_DB: consumo_em_casa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consumo -d consumo_em_casa"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://consumo:consumo@db:5432/consumo_em_casa?schema=public
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
